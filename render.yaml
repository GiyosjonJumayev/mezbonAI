# A public demonstration on Render: sample data and test payments only, clearly marked.
# https://render.com/deploy?repo=https://github.com/GiyosjonJumayev/mezbonAI
# Free databases on Render are deleted after 30 days, and free services sleep when nobody visits. Do not use this file for real guests.
services:
  - type: web
    name: silkroad-demo
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DEMO_SITE
        value: "1"
      - key: DATABASE_URL
        fromDatabase: { name: silkroad-demo-db, property: connectionString }
      - key: ADMIN_KEY
        generateValue: true
databases:
  - name: silkroad-demo-db
    plan: free
